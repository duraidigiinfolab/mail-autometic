name: Mail Automation Bot

on:
  schedule:
    # Run every day at 7:30 AM IST (2:00 AM UTC)
    - cron: '0 2 * * *'
  # Manual runs default to safe mode: no mail is deleted and no Telegram alert is sent.
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run without deleting mail or sending Telegram alerts"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Mail Bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: python mail_bot.py --ai
        
      - name: Save processed emails database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f mail_data.json
          git commit -m "chore: Update processed emails database [skip ci]" || echo "No new emails to save"
          git push
